<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ศักรนันทน์ คำทอง | Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #dff6ff,
                #bde7f7,
                #d5f5e8
            );
            color: #263238;
            text-align: center;
            padding: 25px 15px;
            font-family: Arial, Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 28px;
            box-shadow:
                0 18px 45px rgba(35, 90, 120, 0.18);
            width: 100%;
            min-height: calc(100vh - 50px);
            margin: auto;
            padding: 55px 35px;
            border: 2px solid #c7eaf5;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* วงกลมตกแต่ง */
        .card::before {
            content: "";
            position: absolute;
            width: 200px;
            height: 200px;
            background: #d5f3ff;
            border-radius: 50%;
            top: -100px;
            left: -70px;
        }

        .card::after {
            content: "";
            position: absolute;
            width: 170px;
            height: 170px;
            background: #d9f5e8;
            border-radius: 50%;
            bottom: -85px;
            right: -55px;
        }

        .decoration {
            position: relative;
            z-index: 2;
            font-size: 30px;
            margin-bottom: 25px;
            letter-spacing: 8px;
        }

        h1 {
            position: relative;
            z-index: 2;
            color: #1565c0;
            font-size: 42px;
            line-height: 1.5;
            margin: 0 0 30px;
            font-weight: bold;
        }

        p {
            position: relative;
            z-index: 2;
            font-size: 21px;
            line-height: 2;
            color: #455a64;
            margin: 15px 0;
        }

        strong {
            color: #00897b;
        }

        .line {
            position: relative;
            z-index: 2;
            width: 80px;
            height: 4px;
            background: #29b6f6;
            border-radius: 10px;
            margin: 0 auto 25px;
        }

        /* ปุ่มเข้า Portfolio */
        .btn {
            position: relative;
            z-index: 3;
            display: inline-block;
            margin-top: 30px;
            padding: 15px 32px;
            background: #1565c0;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            box-shadow:
                0 8px 20px rgba(21, 101, 192, 0.25);
            transition: 0.25s;
        }

        .btn:hover {
            background: #0d47a1;
            transform: translateY(-4px);
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .card {
                min-height: calc(100vh - 30px);
                padding: 40px 20px;
                border-radius: 24px;
            }

            h1 {
                font-size: 28px;
            }

            p {
                font-size: 17px;
            }

            .decoration {
                font-size: 25px;
            }

            .btn {
                font-size: 16px;
                padding: 13px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="decoration">
            ⚡ 🧢 ✦
        </div>

        <h1>
            👋 ยินดีต้อนรับสู่โปรไฟล์ของฉัน
        </h1>

        <div class="line"></div>

        <p>
            สวัสดีครับ! ผมชื่อ
            <strong>
                นายศักรนันทน์ คำทอง
            </strong>
        </p>

        <p>
            📍 ขณะนี้กำลังศึกษาชั้นมัธยมศึกษาปีที่ 6
            แผนการเรียน เตรียมวิศวกรรมศาสตร์
        </p>

        <p>
            🎯 เป้าหมายในชีวิต วิศกรอุตสาหการ
        </p>

        <a href="portfolio.html" class="btn">
            📁 ดูแฟ้มสะสมผลงานของฉัน →
        </a>

    </div>

</body>
</html>

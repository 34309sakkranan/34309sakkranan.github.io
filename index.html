<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแรก | Portfolio นายศักรนันทน์ คำทอง</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; padding: 25px 15px;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center; color: #263238;
            background: linear-gradient(135deg, #dff6ff, #bde7f7, #d5f5e8);
        }
        .card {
            position: relative; width: 100%; max-width: 850px;
            min-height: calc(100vh - 60px); padding: 45px 25px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border: 2px solid #c7eaf5; border-radius: 30px; background: rgba(255,255,255,.97);
            box-shadow: 0 18px 45px rgba(35,90,120,.18);
        }
        .profile-frame {
            width: 200px; height: 200px; padding: 8px; margin-bottom: 25px; border-radius: 50%;
            background: linear-gradient(135deg, #29b6f6, #1565c0, #26a69a);
            box-shadow: 0 10px 25px rgba(21,101,192,.25);
        }
        .profile-frame img {
            width: 100%; height: 100%; object-fit: cover; border: 5px solid white; border-radius: 50%;
        }
        .intro-box {
            width: 100%; max-width: 650px; padding: 30px;
            border: 2px solid #c7eaf5; border-radius: 22px; background: #f8fdff;
        }
        .small-title { color: #00897b; font-size: 14px; font-weight: bold; letter-spacing: 4px; margin-bottom: 10px; }
        h1 { margin: 10px 0; color: #1565c0; font-size: 34px; }
        .line { width: 70px; height: 4px; margin: 15px auto; border-radius: 10px; background: #29b6f6; }
        p { margin: 12px 0; color: #455a64; font-size: 18px; line-height: 1.6; }
        .btn {
            display: inline-block; margin-top: 30px; padding: 15px 35px; border-radius: 12px;
            background: #1565c0; color: white; text-decoration: none; font-size: 18px; font-weight: bold;
            box-shadow: 0 8px 20px rgba(21,101,192,.25); transition: .25s;
        }
        .btn:hover { background: #0d47a1; transform: translateY(-4px); }
    </style>
</head>
<body>

    <main class="card">
        <!-- 📷 ช่องสำหรับใส่รูปโปรไฟล์หน้าแรก -->
        <div class="profile-frame">
            <!-- ✏️ แก้ไขชื่อไฟล์รูปภาพของคุณตรงนี้ (src="...") -->
            <img src="70908.jpg" alt="รูปโปรไฟล์ศักรนันทน์">
        </div>

        <section class="intro-box">
            <div class="small-title">PORTFOLIO</div>
            <h1>นายศักรนันทน์ คำทอง</h1>
            <div class="line"></div>
            <p>ขณะนี้กำลังศึกษาชั้น <strong>มัธยมศึกษาปีที่ 6</strong></p>
            <p><strong>แผนการเรียน:</strong> เตรียมวิศวกรรมศาสตร์</p>
            <p style="margin-top: 15px; color: #00897b; font-weight: bold;">
                👋 ยินดีต้อนรับเข้าสู่แฟ้มสะสมผลงานของผมครับ
            </p>
        </section>

        <a href="preface.html" class="btn">เปิดดูแฟ้มสะสมผลงาน (หน้า 2: คำนำ) →</a>
    </main>

</body>
</html>

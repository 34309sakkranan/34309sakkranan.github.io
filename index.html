<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าหลักเว็บไซต์ของผม</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #111111,
                #242424,
                #3a3a3a
            );
            color: #333;
            text-align: center;
            padding: 30px 20px;
            font-family: Arial, Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 35px;
            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.35);
            width: 100%;
            min-height: calc(100vh - 60px);
            margin: auto;
            padding: 60px 35px;
            border: 1px solid #555555;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* วงกลมตกแต่ง */
        .card::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            background: #eeeeee;
            border-radius: 50%;
            top: -90px;
            left: -60px;
        }

        .card::after {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            background: #e2e2e2;
            border-radius: 50%;
            bottom: -75px;
            right: -50px;
        }

        .decoration {
            position: relative;
            z-index: 2;
            font-size: 30px;
            margin-bottom: 25px;
            letter-spacing: 10px;
            filter: grayscale(100%);
        }

        h1 {
            position: relative;
            z-index: 2;
            color: #222222;
            font-size: 42px;
            line-height: 1.5;
            margin: 0 0 35px;
            font-weight: bold;
        }

        p {
            position: relative;
            z-index: 2;
            font-size: 21px;
            line-height: 2;
            color: #444444;
            margin: 18px 0;
        }

        strong {
            color: #222222;
        }

        .line {
            position: relative;
            z-index: 2;
            width: 80px;
            height: 3px;
            background: #555555;
            margin: 0 auto 25px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .card {
                min-height: calc(100vh - 30px);
                padding: 40px 20px;
                border-radius: 25px;
            }

            h1 {
                font-size: 28px;
            }

            p {
                font-size: 17px;
            }

            .decoration {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="decoration">
            ☁️ 🙌🏻🙌🏻
        </div>

        <h1>
            ยินดีต้อนรับสู่โปรไฟล์ของผม
        </h1>

        <div class="line"></div>

        <p>
            สวัสดีครับ! ผมชื่อ
            <strong>
                นายศักรนันทน์ คำทอง
            </strong>
        </p>

        <p>
            📍ขณะนี้กำลังศึกษาชั้นมัธยมศึกษาปีที่ 6
            แผนการเรียน เตรียมวิศวกรรมศาสตร์👷‍♂️
        </p>

        <p>
            🎯เป้าหมายในชีวิต วิศวกรอุตสาหกรรม
        </p>

    </div>

</body>
</html>
